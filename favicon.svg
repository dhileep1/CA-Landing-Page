<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <!-- Background Circle to ensure crisp visibility across Light & Dark browser tabs -->
  <circle cx="50" cy="50" r="46.5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5" filter="url(#shadow)"/>
  
  <!-- Embedded Official CA Logo Emblem from assets/logo.png -->
  <image href="data:image/png;base64," x="16.5" y="29.3" width="70" height="41.4" preserveAspectRatio="xMidYMid meet"/>
</svg>
